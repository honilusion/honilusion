<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hub</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2e2e2e;
      --border: #3a3a3a;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #4caf50;
      --accent-dim: #2e7d32;
      --red: #e06c75;
      --yellow: #e5c07b;
      --blue: #61afef;
      --radius: 6px;
      --font: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .subtitle { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
    #refresh-status { color: var(--text-dim); font-size: 12px; }
    .token-area {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
    }
    #token-input {
      width: 220px; padding: 5px 8px; font-size: 12px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: monospace;
    }
    #token-input:focus { outline: none; border-color: var(--accent); }
    #token-save-btn {
      padding: 5px 10px; font-size: 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: transparent; color: var(--text-dim);
      cursor: pointer; font-family: var(--font);
    }
    #token-save-btn:hover { color: var(--text); border-color: var(--text-dim); }
    .hub-icon { color: var(--accent); }

    main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 32px; }

    .section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title svg { color: var(--accent); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-body { padding: 16px; }

    /* Forms */
    label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    input, textarea, select {
      width: 100%; padding: 7px 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      font: inherit; font-size: 13px;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-group { margin-bottom: 10px; }
    .btn {
      padding: 7px 14px; border: none; border-radius: var(--radius);
      cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-ghost {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border); padding: 4px 10px; font-size: 12px;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }

    /* Inbox */
    .agent-select-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .agent-select-row select { max-width: 220px; }
    #inbox-agent-input { max-width: 180px; flex: none; }
    .msg-list { display: flex; flex-direction: column; gap: 8px; }
    .msg-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    }
    .msg-item.unread { border-left: 3px solid var(--accent); }
    .msg-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .msg-content { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
    .msg-project { font-size: 11px; color: var(--blue); margin-top: 4px; }
    .unread-badge {
      display: inline-block; background: var(--accent); color: #000;
      font-size: 10px; font-weight: 700; border-radius: 10px;
      padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .empty-state { color: var(--text-dim); font-style: italic; padding: 12px 0; text-align: center; }

    /* Projects table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; color: var(--text-dim); font-size: 11px; font-weight: 600;
         border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .04em; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .status-badge {
      display: inline-block; border-radius: 4px; padding: 2px 8px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    }
    .status-open       { background: #3a3a3a; color: #aaa; }
    .status-in_progress{ background: #1b3a1e; color: var(--accent); }
    .status-blocked    { background: #3a1e1e; color: var(--red); }
    .status-done       { background: #222;     color: #555; }

    .inline-edit-row { display: flex; gap: 6px; align-items: center; }
    .inline-edit-row select { max-width: 140px; }
    .inline-edit-row input { flex: 1; }

    /* Compose / add forms */
    .compose-card { margin-top: 16px; }
    .compose-title { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }

    /* Error */
    .error-banner {
      background: #3a1e1e; border: 1px solid var(--red); color: var(--red);
      border-radius: var(--radius); padding: 8px 12px; font-size: 12px; margin-bottom: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <svg class="hub-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M3 12h3m12 0h3M12 3v3m0 12v3"/>
    <path d="M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
  </svg>
  <div>
    <h1>Agent Hub</h1>
    <div class="subtitle">Coordination layer — inbox &amp; projects</div>
  </div>
  <div class="token-area">
    <input id="token-input" type="password" placeholder="ody_... Bearer token" autocomplete="off">
    <button id="token-save-btn">Save token</button>
    <div id="refresh-status">auto-refresh in <span id="countdown">30</span>s</div>
  </div>
</header>

<main>

  <!-- ====== INBOX ====== -->
  <section>
    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
      Inbox
      <span id="unread-badge" class="unread-badge hidden">0</span>
    </div>

    <div class="agent-select-row">
      <label for="inbox-agent-input" style="margin:0;white-space:nowrap">View messages for:</label>
      <input id="inbox-agent-input" placeholder="agent name" value="">
      <button id="load-inbox-btn" class="btn btn-ghost">Load</button>
    </div>

    <div id="inbox-error" class="error-banner hidden"></div>
    <div id="inbox-list" class="msg-list">
      <div class="empty-state">Enter an agent name and click Load.</div>
    </div>

    <!-- Compose -->
    <div class="compose-card card" style="margin-top:20px">
      <div class="card-body">
        <div class="compose-title">Compose message</div>
        <div id="compose-error" class="error-banner hidden"></div>
        <div class="form-row">
          <div class="form-group">
            <label>From agent</label>
            <input id="compose-from" placeholder="e.g. claude-code">
          </div>
          <div class="form-group">
            <label>To agent</label>
            <input id="compose-to" placeholder="e.g. charles">
          </div>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="compose-content" placeholder="Message content..."></textarea>
        </div>
        <div class="form-group">
          <label>Related project (optional ID)</label>
          <input id="compose-project-id" placeholder="project id">
        </div>
        <button id="send-msg-btn" class="btn btn-primary">Send Message</button>
      </div>
    </div>
  </section>

  <!-- ====== PROJECTS ====== -->
  <section>
    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      Projects
    </div>

    <div class="card">
      <div id="projects-error" class="error-banner hidden" style="margin:12px 12px 0"></div>
      <table id="projects-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Owner</th>
            <th>Notes</th>
            <th style="width:80px">Save</th>
          </tr>
        </thead>
        <tbody id="projects-body">
          <tr><td colspan="5" class="empty-state" style="text-align:center;padding:20px">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Add project -->
    <div class="card compose-card">
      <div class="card-body">
        <div class="compose-title">Add / update project</div>
        <div id="addproj-error" class="error-banner hidden"></div>
        <div class="form-row three">
          <div class="form-group">
            <label>Name</label>
            <input id="proj-name" placeholder="project-name">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="proj-status">
              <option value="open">open</option>
              <option value="in_progress">in_progress</option>
              <option value="blocked">blocked</option>
              <option value="done">done</option>
            </select>
          </div>
          <div class="form-group">
            <label>Owner agent</label>
            <input id="proj-owner" placeholder="optional">
          </div>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="proj-notes" placeholder="Project notes..." style="min-height:50px"></textarea>
        </div>
        <button id="add-project-btn" class="btn btn-primary">Save Project</button>
      </div>
    </div>
  </section>

</main>

<script>
const API = '/api/hub';
let _countdown = 30;
let _countdownTimer = null;
let _refreshTimer = null;

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getBearerToken() {
  return localStorage.getItem('hub_bearer_token') || '';
}

async function apiFetch(path, opts = {}) {
  const token = getBearerToken();
  const authHeader = token ? { 'Authorization': 'Bearer ' + token } : {};
  const r = await fetch(API + path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', ...authHeader, ...(opts.headers || {}) },
    ...opts,
  });
  if (!r.ok) {
    if (r.status === 401) throw new Error('Auth failed — check Bearer token or log in');
    const txt = await r.text().catch(() => r.statusText);
    throw new Error(`HTTP ${r.status}: ${txt}`);
  }
  return r.json();
}

function saveToken() {
  const val = document.getElementById('token-input').value.trim();
  if (val) {
    localStorage.setItem('hub_bearer_token', val);
  } else {
    localStorage.removeItem('hub_bearer_token');
  }
  refresh();
  loadProjects();
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}
function clearError(id) {
  document.getElementById(id).classList.add('hidden');
}

// ---- Inbox ----

async function loadInbox() {
  const agent = document.getElementById('inbox-agent-input').value.trim();
  clearError('inbox-error');
  const listEl = document.getElementById('inbox-list');
  if (!agent) {
    listEl.innerHTML = '<div class="empty-state">Enter an agent name.</div>';
    return;
  }
  try {
    const msgs = await apiFetch(`/inbox/${encodeURIComponent(agent)}`);
    const unread = msgs.filter(m => !m.read_at);
    const badge = document.getElementById('unread-badge');
    if (unread.length > 0) {
      badge.textContent = unread.length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
    if (msgs.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No messages.</div>';
      return;
    }
    listEl.innerHTML = msgs.map(m => {
      const isUnread = !m.read_at;
      const ts = m.created_at ? new Date(m.created_at + 'Z').toLocaleString() : '';
      const proj = m.related_project_id ? `<div class="msg-project">Project: ${esc(m.related_project_id)}</div>` : '';
      const readBtn = isUnread
        ? `<button class="btn btn-ghost" data-action="mark-read" data-id="${esc(m.id)}">Mark read</button>`
        : `<span style="color:var(--text-dim);font-size:11px">read</span>`;
      return `
        <div class="msg-item${isUnread ? ' unread' : ''}" id="msg-${esc(m.id)}">
          <div>
            <div class="msg-meta">from <strong>${esc(m.from_agent)}</strong> · ${esc(ts)} · id: ${esc(m.id)}</div>
            <div class="msg-content">${esc(m.content)}</div>
            ${proj}
          </div>
          <div>${readBtn}</div>
        </div>`;
    }).join('');
  } catch (e) {
    showError('inbox-error', e.message);
    listEl.innerHTML = '';
  }
}

async function markRead(msgId) {
  try {
    await apiFetch(`/inbox/${encodeURIComponent(msgId)}/read`, { method: 'PATCH' });
    loadInbox();
  } catch (e) {
    showError('inbox-error', 'Failed to mark read: ' + e.message);
  }
}

async function sendMessage() {
  clearError('compose-error');
  const from = document.getElementById('compose-from').value.trim();
  const to = document.getElementById('compose-to').value.trim();
  const content = document.getElementById('compose-content').value.trim();
  const proj = document.getElementById('compose-project-id').value.trim();
  if (!from || !to || !content) {
    showError('compose-error', 'from_agent, to_agent, and content are required');
    return;
  }
  try {
    await apiFetch('/inbox', {
      method: 'POST',
      body: JSON.stringify({ from_agent: from, to_agent: to, content, related_project_id: proj || null }),
    });
    document.getElementById('compose-content').value = '';
    document.getElementById('compose-project-id').value = '';
    // Reload inbox if showing the recipient
    const viewing = document.getElementById('inbox-agent-input').value.trim();
    if (viewing === to) loadInbox();
  } catch (e) {
    showError('compose-error', e.message);
  }
}

// ---- Projects ----

async function loadProjects() {
  clearError('projects-error');
  try {
    const projects = await apiFetch('/projects');
    const tbody = document.getElementById('projects-body');
    if (projects.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="text-align:center;padding:20px">No projects yet.</td></tr>';
      return;
    }
    tbody.innerHTML = projects.map(p => {
      const statusClass = 'status-' + (p.status || 'open').replace(/[^a-z_]/g, '');
      return `
        <tr id="proj-row-${esc(p.id)}">
          <td><strong>${esc(p.name)}</strong><br><small style="color:var(--text-dim)">${esc(p.id)}</small></td>
          <td>
            <select id="proj-status-${esc(p.id)}">
              ${['open','in_progress','blocked','done'].map(s =>
                `<option value="${s}"${p.status===s?' selected':''}>${s}</option>`
              ).join('')}
            </select>
          </td>
          <td>
            <input id="proj-owner-${esc(p.id)}" value="${esc(p.owner_agent || '')}" placeholder="(none)" style="width:120px">
          </td>
          <td>
            <input id="proj-notes-${esc(p.id)}" value="${esc(p.notes || '')}" placeholder="—">
          </td>
          <td>
            <button class="btn btn-ghost" data-action="save-project" data-name="${esc(p.name)}" data-id="${esc(p.id)}">Save</button>
          </td>
        </tr>`;
    }).join('');
  } catch (e) {
    showError('projects-error', e.message);
  }
}

async function saveProjectRow(name, id) {
  clearError('projects-error');
  const status = document.getElementById('proj-status-' + id).value;
  const owner = document.getElementById('proj-owner-' + id).value.trim();
  const notes = document.getElementById('proj-notes-' + id).value.trim();
  try {
    await apiFetch(`/projects/${encodeURIComponent(name)}`, {
      method: 'PATCH',
      body: JSON.stringify({ status, owner_agent: owner || null, notes: notes || null }),
    });
    loadProjects();
  } catch (e) {
    showError('projects-error', 'Save failed: ' + e.message);
  }
}

async function addProject() {
  clearError('addproj-error');
  const name = document.getElementById('proj-name').value.trim();
  const status = document.getElementById('proj-status').value;
  const owner = document.getElementById('proj-owner').value.trim();
  const notes = document.getElementById('proj-notes').value.trim();
  if (!name) {
    showError('addproj-error', 'Project name is required');
    return;
  }
  try {
    await apiFetch('/projects', {
      method: 'POST',
      body: JSON.stringify({ name, status, owner_agent: owner || null, notes: notes || null }),
    });
    document.getElementById('proj-name').value = '';
    document.getElementById('proj-notes').value = '';
    document.getElementById('proj-owner').value = '';
    loadProjects();
  } catch (e) {
    showError('addproj-error', e.message);
  }
}

// ---- Auto-refresh ----

function tick() {
  _countdown--;
  document.getElementById('countdown').textContent = _countdown;
  if (_countdown <= 0) {
    _countdown = 30;
    refresh();
  }
}

function refresh() {
  loadProjects();
  const agent = document.getElementById('inbox-agent-input').value.trim();
  if (agent) loadInbox();
}

function startCountdown() {
  if (_countdownTimer) clearInterval(_countdownTimer);
  _countdown = 30;
  _countdownTimer = setInterval(tick, 1000);
}

// ---- Event listeners ----

document.getElementById('token-save-btn').addEventListener('click', saveToken);
document.getElementById('load-inbox-btn').addEventListener('click', loadInbox);
document.getElementById('send-msg-btn').addEventListener('click', sendMessage);
document.getElementById('add-project-btn').addEventListener('click', addProject);

// Event delegation for dynamically rendered inbox buttons
document.getElementById('inbox-list').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-action="mark-read"]');
  if (btn) markRead(btn.dataset.id);
});

// Event delegation for dynamically rendered project row save buttons
document.getElementById('projects-body').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-action="save-project"]');
  if (btn) saveProjectRow(btn.dataset.name, btn.dataset.id);
});

// Init — restore saved token, auto-load inbox if token present
(function init() {
  const saved = localStorage.getItem('hub_bearer_token');
  if (saved) {
    document.getElementById('token-input').value = saved;
    document.getElementById('inbox-agent-input').value = 'claude-code-server';
    loadInbox();
  }
  loadProjects();
  startCountdown();
})();
</script>
</body>
</html>
