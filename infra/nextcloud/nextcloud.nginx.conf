server {
    listen 80;
    server_name cloud.olusion.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443;
    server_name cloud.olusion.net;

    # 10G limit is intentionally in this block (the 443/SSL block), not the 80 redirect.
    # Certbot --nginx will add "ssl" and the cert directives to this listen line.
    client_max_body_size 10G;

    # CalDAV / CardDAV well-known redirects (required by Nextcloud)
    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location / {
        proxy_pass         http://127.0.0.1:7200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
